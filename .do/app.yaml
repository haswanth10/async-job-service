# DigitalOcean App Platform spec.
#
# The API and the workers are separate components built from the same Dockerfile, so each has its own
# instance_count and scales on its own.
#
#   1. Replace YOUR_GITHUB_USER/async-job-service below.
#   2. doctl apps create --spec .do/app.yaml
#   3. Scale workers only: change workers[0].instance_count, then
#      doctl apps update <app-id> --spec .do/app.yaml

name: async-job-service
region: blr

databases:
  - name: jobs-db
    engine: PG
    version: "16"
    production: false   # dev database; use a managed cluster (production: true) for real load

services:
  - name: api
    github:
      repo: YOUR_GITHUB_USER/async-job-service
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /actuator/health/readiness
      initial_delay_seconds: 30
    envs:
      - key: JOBS_WORKER_ENABLED
        value: "false"
      - key: JOBS_DB_POOL_SIZE
        value: "4"
      - key: LOGGING_STRUCTURED_FORMAT_CONSOLE
        value: ecs
      - key: JOBS_DB_URL
        value: jdbc:postgresql://${jobs-db.HOSTNAME}:${jobs-db.PORT}/${jobs-db.DATABASE}?sslmode=require
      - key: JOBS_DB_USER
        value: ${jobs-db.USERNAME}
      - key: JOBS_DB_PASSWORD
        type: SECRET
        value: ${jobs-db.PASSWORD}

workers:
  - name: worker
    github:
      repo: YOUR_GITHUB_USER/async-job-service
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    instance_count: 2            # <- scale this independently of the API
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: JOBS_API_ENABLED
        value: "false"
      - key: JOBS_WORKER_ENABLED
        value: "true"
      - key: JOBS_WORKER_CONCURRENCY
        value: "8"
      - key: JOBS_DB_POOL_SIZE
        value: "4"
      - key: LOGGING_STRUCTURED_FORMAT_CONSOLE
        value: ecs
      - key: JOBS_DB_URL
        value: jdbc:postgresql://${jobs-db.HOSTNAME}:${jobs-db.PORT}/${jobs-db.DATABASE}?sslmode=require
      - key: JOBS_DB_USER
        value: ${jobs-db.USERNAME}
      - key: JOBS_DB_PASSWORD
        type: SECRET
        value: ${jobs-db.PASSWORD}
