name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobs
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JOBS_DB_URL: jdbc:postgresql://localhost:5432/jobs
      JOBS_DB_USER: postgres
      JOBS_DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # surefire runs *Test (unit); failsafe runs *IT (integration, against the Postgres service above)
      - name: Build and run the full test suite
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t async-job-service:${{ github.sha }} .
